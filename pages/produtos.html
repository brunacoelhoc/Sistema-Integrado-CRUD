<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/crud.css">
</head>

<body>
    <div id="vanta-bg"></div>

    <div class="app-container">
        <header>
            <nav>
                <a href="../index.html">📊 Dashboard</a>
                <a href="produtos.html" class="active">📦 Produtos</a>
                <a href="estoque.html">🏭 Estoque</a>
                <a href="pedidos.html">🛒 Pedidos</a>
            </nav>
        </header>

        <main class="glass-card">
            <div class="controls-bar">
                <h2>Gerenciamento de Produtos</h2>
                <button class="btn" id="btn-novo-produto">+ Novo Produto</button>
            </div>

            <div class="controls-bar">
                <div class="search-box">
                    <input type="text" id="input-busca" placeholder="Buscar por nome ou categoria...">
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Status (Derivado)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tb-produtos">
                        <!-- Renderizado via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Cadastrar/Editar -->
    <div class="modal-overlay" id="modal-produto">
        <div class="glass-card modal-body">
            <h3 id="modal-title" style="margin-bottom: 1rem">Novo Produto</h3>
            <form id="form-produto">
                <input type="hidden" id="produto-id">
                <div class="form-group">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria *</label>
                    <input type="text" id="categoria" required>
                </div>
                <div class="form-group">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" step="0.01" min="0" required>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
                    ℹ️ O status é recalculado automaticamente com base na quantidade em Estoque.
                </p>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/produtos.js"></script>
</body>

</html>
